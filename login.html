<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Admin login for the portfolio." />
  <title>AI Portfolio | Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="dark" class="min-h-screen flex items-center justify-center bg-slate-950 text-slate-100 px-4">
  <main class="w-full max-w-md space-y-6">
    <section class="bg-slate-900/70 border border-slate-800 rounded-2xl p-6 shadow-2xl">
      <p class="text-sm uppercase tracking-[0.3em] text-indigo-400 mb-2">Admin Access</p>
      <h1 class="text-3xl font-bold mb-2">Sign in</h1>
      <p class="text-sm text-slate-300 mb-6">Use your admin credentials to open the dashboard.</p>

      <form id="login-form" class="space-y-4">
        <div>
          <label for="email" class="block text-sm mb-1">Email</label>
          <input id="email" name="email" type="email" required class="w-full px-3 py-2 rounded bg-slate-950 border border-slate-700 text-sm" />
        </div>
        <div>
          <label for="password" class="block text-sm mb-1">Password</label>
          <input id="password" name="password" type="password" required class="w-full px-3 py-2 rounded bg-slate-950 border border-slate-700 text-sm" />
        </div>
        <button type="submit" class="w-full px-5 py-2 rounded-full bg-indigo-500 hover:bg-indigo-600 text-sm font-medium">
          Login
        </button>
        <p id="login-status" class="text-xs"></p>
      </form>
    </section>

    <p class="text-center text-xs text-slate-400">
      <a href="index.html" class="hover:text-indigo-300">Back to home</a>
    </p>
  </main>

  <script src="env.js"></script>
  <script src="auth.js"></script>
</body>
</html>
